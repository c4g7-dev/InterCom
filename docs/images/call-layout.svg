<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Illustration of the InterCom call view (equal grid, tile controls, pop-out). Not a screenshot. CC0. -->
  <rect width="1280" height="760" fill="#0d0f12"/>
  <!-- main window -->
  <rect x="32" y="32" width="860" height="696" rx="14" fill="#111317" stroke="#23272f"/>
  <rect x="32" y="32" width="860" height="44" rx="14" fill="#15181d"/>
  <rect x="32" y="62" width="860" height="14" fill="#15181d"/>
  <circle cx="58" cy="54" r="6" fill="#2f3573"/><circle cx="78" cy="54" r="6" fill="#23272f"/><circle cx="98" cy="54" r="6" fill="#23272f"/>
  <text x="124" y="59" fill="#9199a4" font-size="14">Design review</text>
  <rect x="756" y="42" width="120" height="24" rx="12" fill="#1f232b"/>
  <text x="816" y="58.5" fill="#ebeef2" font-size="12" text-anchor="middle">Equal grid</text>

  <!-- tile 1: screen share -->
  <g>
    <rect x="52" y="96" width="402" height="262" rx="10" fill="#181b21" stroke="#6875f5" stroke-width="2"/>
    <rect x="68" y="112" width="370" height="196" rx="4" fill="#0d0f12"/>
    <rect x="68" y="112" width="370" height="18" rx="4" fill="#1f232b"/>
    <rect x="68" y="130" width="78" height="178" fill="#15181d"/>
    <g fill="#23272f">
      <rect x="76" y="142" width="58" height="6" rx="3"/><rect x="76" y="156" width="46" height="6" rx="3"/><rect x="76" y="170" width="54" height="6" rx="3"/><rect x="76" y="184" width="40" height="6" rx="3"/>
    </g>
    <g>
      <rect x="160" y="144" width="120" height="6" rx="3" fill="#8b96f8"/>
      <rect x="160" y="160" width="250" height="5" rx="2.5" fill="#3a4049"/>
      <rect x="160" y="172" width="226" height="5" rx="2.5" fill="#3a4049"/>
      <rect x="160" y="184" width="240" height="5" rx="2.5" fill="#3a4049"/>
      <rect x="160" y="196" width="180" height="5" rx="2.5" fill="#3a4049"/>
      <rect x="160" y="216" width="92" height="6" rx="3" fill="#8b96f8"/>
      <rect x="160" y="232" width="244" height="5" rx="2.5" fill="#3a4049"/>
      <rect x="160" y="244" width="210" height="5" rx="2.5" fill="#3a4049"/>
      <rect x="160" y="256" width="232" height="5" rx="2.5" fill="#3a4049"/>
      <rect x="160" y="276" width="64" height="18" rx="9" fill="#6875f5"/>
    </g>
    <text x="68" y="338" fill="#ebeef2" font-size="13">Alice's screen</text>
    <text x="438" y="338" fill="#9199a4" font-size="12" text-anchor="end">2560 × 1440 · AV1 · 30 fps</text>
  </g>

  <!-- camera tiles -->
  <g font-size="13">
    <rect x="470" y="96" width="402" height="262" rx="10" fill="#181b21" stroke="#23272f"/>
    <circle cx="671" cy="212" r="46" fill="#252a5c"/><text x="671" y="223" fill="#b0b7fb" font-size="32" text-anchor="middle">A</text>
    <text x="486" y="338" fill="#ebeef2">Alice</text>

    <rect x="52" y="374" width="402" height="262" rx="10" fill="#181b21" stroke="#23272f"/>
    <circle cx="253" cy="490" r="46" fill="#1d3a34"/><text x="253" y="501" fill="#8fd6c2" font-size="32" text-anchor="middle">B</text>
    <text x="68" y="616" fill="#ebeef2">Bob</text>

    <rect x="470" y="374" width="402" height="262" rx="10" fill="#181b21" stroke="#23272f"/>
    <circle cx="671" cy="490" r="46" fill="#3d2a1c"/><text x="671" y="501" fill="#e6b98a" font-size="32" text-anchor="middle">C</text>
    <text x="486" y="616" fill="#ebeef2">Carol</text>
  </g>

  <!-- tile controls on Bob's tile -->
  <g>
    <rect x="232" y="386" width="210" height="36" rx="18" fill="#0d0f12" stroke="#23272f"/>
    <!-- speaker -->
    <path d="M248 400h5l6-5v18l-6-5h-5z" fill="#ebeef2"/>
    <rect x="268" y="402" width="92" height="4" rx="2" fill="#23272f"/>
    <rect x="268" y="402" width="64" height="4" rx="2" fill="#6875f5"/>
    <circle cx="332" cy="404" r="6" fill="#ebeef2"/>
    <text x="368" y="408.5" fill="#9199a4" font-size="11">140%</text>
    <!-- fullscreen -->
    <path d="M402 398h5v2h-3v3h-2zM416 398h-5v2h3v3h2zM402 410h5v-2h-3v-3h-2zM416 410h-5v-2h3v-3h2z" fill="#ebeef2"/>
    <!-- pop-out -->
    <path d="M424 399h6v2h-4v8h8v-4h2v6h-12z M432 397h6v6h-2v-2.6l-4.300 4.300-1.400-1.400 4.300-4.300H432z" fill="#ebeef2"/>
  </g>

  <!-- call bar -->
  <g>
    <circle cx="372" cy="686" r="20" fill="#1f232b"/><rect x="367" y="675" width="10" height="16" rx="5" fill="#ebeef2"/><path d="M362 686a10 10 0 0 0 20 0" fill="none" stroke="#ebeef2" stroke-width="2"/><rect x="371" y="696" width="2" height="4" fill="#ebeef2"/>
    <circle cx="422" cy="686" r="20" fill="#1f232b"/><rect x="411" y="679" width="15" height="14" rx="3" fill="#ebeef2"/><path d="M427 685l6-4v10l-6-4z" fill="#ebeef2"/>
    <circle cx="472" cy="686" r="20" fill="#6875f5"/><rect x="461" y="677" width="22" height="15" rx="2" fill="none" stroke="#fff" stroke-width="2"/><rect x="467" y="694" width="10" height="2" fill="#fff"/>
    <circle cx="522" cy="686" r="20" fill="#1f232b"/><circle cx="514" cy="686" r="2" fill="#ebeef2"/><circle cx="522" cy="686" r="2" fill="#ebeef2"/><circle cx="530" cy="686" r="2" fill="#ebeef2"/>
    <rect x="552" y="666" width="56" height="40" rx="20" fill="#ff5b55"/><path d="M568 689c8-7 16-7 24 0l-3 4-5-2v-4h-8v4l-5 2z" fill="#fff"/>
  </g>

  <!-- pop-out window -->
  <g>
    <rect x="924" y="96" width="324" height="246" rx="12" fill="#111317" stroke="#23272f"/>
    <rect x="924" y="96" width="324" height="34" rx="12" fill="#15181d"/><rect x="924" y="118" width="324" height="12" fill="#15181d"/>
    <text x="940" y="118" fill="#9199a4" font-size="12">Alice's screen — pop-out</text>
    <rect x="936" y="140" width="300" height="190" rx="4" fill="#0d0f12"/>
    <rect x="936" y="140" width="300" height="14" rx="4" fill="#1f232b"/>
    <rect x="936" y="154" width="62" height="176" fill="#15181d"/>
    <rect x="1010" y="166" width="96" height="5" rx="2.5" fill="#8b96f8"/>
    <g fill="#3a4049"><rect x="1010" y="180" width="204" height="4" rx="2"/><rect x="1010" y="190" width="184" height="4" rx="2"/><rect x="1010" y="200" width="196" height="4" rx="2"/><rect x="1010" y="210" width="150" height="4" rx="2"/><rect x="1010" y="238" width="198" height="4" rx="2"/><rect x="1010" y="248" width="170" height="4" rx="2"/><rect x="1010" y="258" width="190" height="4" rx="2"/></g>
    <rect x="1010" y="224" width="74" height="5" rx="2.5" fill="#8b96f8"/>
  </g>

  <!-- diagnostics overlay -->
  <g font-size="12">
    <rect x="924" y="366" width="324" height="270" rx="12" fill="#15181d" stroke="#23272f"/>
    <text x="940" y="392" fill="#ebeef2" font-size="13" font-weight="600">Diagnostics</text>
    <text x="1232" y="392" fill="#9199a4" text-anchor="end">Ctrl+Alt+D</text>
    <line x1="940" y1="404" x2="1232" y2="404" stroke="#23272f"/>
    <g fill="#9199a4">
      <text x="940" y="428">Screen share (sent)</text><text x="940" y="450">Codec</text><text x="940" y="472">Bitrate</text><text x="940" y="494">Limitation</text><text x="940" y="516">Round trip</text>
    </g>
    <g fill="#ebeef2" text-anchor="end" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">
      <text x="1232" y="428">2560×1440 @ 30</text><text x="1232" y="450">AV1</text><text x="1232" y="472">14.8 Mbps</text><text x="1232" y="494">none</text><text x="1232" y="516">18 ms</text>
    </g>
    <line x1="940" y1="532" x2="1232" y2="532" stroke="#23272f"/>
    <g fill="#ebeef2">
      <circle cx="946" cy="552" r="4" fill="#3ecf8e"/><text x="960" y="556">Mic publishing with audio</text>
      <circle cx="946" cy="574" r="4" fill="#3ecf8e"/><text x="960" y="578">Screen share at expected resolution</text>
      <circle cx="946" cy="596" r="4" fill="#3ecf8e"/><text x="960" y="600">Share audio flowing</text>
      <circle cx="946" cy="618" r="4" fill="#3ecf8e"/><text x="960" y="622">No quality limitation</text>
    </g>
  </g>
  <text x="1248" y="716" fill="#4a515c" font-size="11" text-anchor="end">Illustration</text>
</svg>
